<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky-s" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000a1a"/>
      <stop offset="40%" stop-color="#001530"/>
      <stop offset="100%" stop-color="#000812"/>
    </linearGradient>
    <radialGradient id="moon-glow" cx="80%" cy="15%" r="20%">
      <stop offset="0%" stop-color="#88ccff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#sky-s)"/>
  <rect width="1200" height="500" fill="url(#moon-glow)"/>
  <!-- Moon -->
  <circle cx="960" cy="80" r="30" fill="#88ccff" opacity="0.15"/>
  <circle cx="960" cy="80" r="25" fill="#aaddff" opacity="0.08"/>
  <!-- Crystal spires -->
  <polygon points="100,500 120,200 140,500" fill="#1a3355" opacity="0.7"/>
  <polygon points="115,500 125,160 135,500" fill="#2255aa" opacity="0.3"/>
  <polygon points="250,500 280,150 310,500" fill="#1a3355" opacity="0.8"/>
  <polygon points="265,500 280,120 295,500" fill="#44aaff" opacity="0.15"/>
  <polygon points="450,500 480,180 510,500" fill="#0d2244" opacity="0.7"/>
  <polygon points="465,500 480,140 495,500" fill="#2266cc" opacity="0.2"/>
  <polygon points="650,500 690,100 730,500" fill="#1a3355" opacity="0.8"/>
  <polygon points="670,500 690,70 710,500" fill="#44aaff" opacity="0.12"/>
  <polygon points="850,500 880,160 910,500" fill="#0d2244" opacity="0.7"/>
  <polygon points="865,500 880,130 895,500" fill="#2266cc" opacity="0.2"/>
  <polygon points="1050,500 1080,190 1110,500" fill="#1a3355" opacity="0.7"/>
  <polygon points="1065,500 1080,160 1095,500" fill="#44aaff" opacity="0.15"/>
  <!-- Frozen ground -->
  <path d="M0,450 Q200,430 400,445 Q600,430 800,445 Q1000,435 1200,450 L1200,500 L0,500 Z" fill="#0a1a2e" opacity="0.8"/>
  <!-- Snow particles -->
  <circle cx="100" cy="100" r="1.5" fill="#88ccff" opacity="0.5"/>
  <circle cx="300" cy="200" r="1" fill="#aaddff" opacity="0.4"/>
  <circle cx="500" cy="150" r="1.5" fill="#88ccff" opacity="0.3"/>
  <circle cx="700" cy="250" r="1" fill="#aaddff" opacity="0.4"/>
  <circle cx="900" cy="120" r="1.5" fill="#88ccff" opacity="0.5"/>
  <circle cx="1100" cy="180" r="1" fill="#aaddff" opacity="0.3"/>
  <circle cx="150" cy="350" r="1" fill="#88ccff" opacity="0.3"/>
  <circle cx="550" cy="320" r="1.5" fill="#aaddff" opacity="0.4"/>
  <circle cx="950" cy="350" r="1" fill="#88ccff" opacity="0.3"/>
  <!-- Bridge structure -->
  <path d="M380,420 Q500,380 620,420" fill="none" stroke="#1a3355" stroke-width="4" opacity="0.5"/>
  <line x1="420" y1="420" x2="420" y2="395" stroke="#0d2244" stroke-width="2" opacity="0.4"/>
  <line x1="500" y1="420" x2="500" y2="382" stroke="#0d2244" stroke-width="2" opacity="0.4"/>
  <line x1="580" y1="420" x2="580" y2="395" stroke="#0d2244" stroke-width="2" opacity="0.4"/>
</svg>
